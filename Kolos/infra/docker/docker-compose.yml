services:
  # ==========================================
  # BAZA DANYCH (POSTGRESQL)
  # ==========================================
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: kolos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ==========================================
  # BACKEND (DJANGO API)
  # ==========================================
  backend:
    build: ../../backend
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/Kolos
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      # Te zmienne nadpiszą domyślne ustawienia z settings.py
      - POSTGRES_DB=kolos_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db # Backend poczeka ze startem, aż baza się uruchomi

  # ==========================================
  # FRONTEND (NEXT.JS)
  # ==========================================
  web:
    build: ../../web
    ports:
      - "3000:3000"
    volumes:
      - ../../web:/Kolos
      # Keep Linux native deps (lightningcss, next-swc) — host mount is Windows
      - web_node_modules:/Kolos/node_modules
    environment:
      - NODE_ENV=development

# Wolumen nazwany, aby dane w bazie nie znikały po resecie kontenera
volumes:
  postgres_data:
  web_node_modules: